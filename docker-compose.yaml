services:
  db:
    image: postgres:16
    container_name: economyatlas_db
    environment:
      POSTGRES_DB: economyatlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: